name: nota
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  dartz: ^0.10.1
  any_link_preview: ^3.0.1
  url_launcher: ^6.3.2
  receive_sharing_intent: ^1.9.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_localizations:
    sdk: flutter
  go_router: ^17.3.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.2.3
  flutter_timezone: ^5.1.0
  intl: ^0.20.2
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: any
  isar_generator: any

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
